services:
  shoe-store:
    container_name: shoe-store
    build: .
    networks:
      - bridge-network
    ports:
      - "8080:8080"
    env_file:
      - environment/.env               # same DB name and credentials as the postgres service
    environment:
      DB_HOST: postgres
      SPRING_PROFILES_ACTIVE: local    # built-in payment mock; for a real provider set PAYMENT_PROVIDER_URL instead
    depends_on:
      postgres:
        condition: service_healthy     # Flyway needs the DB up before the app starts

  postgres:
    image: postgres:16
    env_file:
      - environment/.env
    ports:
      - "5432:5432"
    networks:
      - bridge-network
    volumes:
      - shoe-store-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      retries: 30

networks:
  bridge-network:
    name: bridge-network
    driver: bridge

volumes:
  shoe-store-postgres:
